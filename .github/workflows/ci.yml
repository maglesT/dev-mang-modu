name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev_owner
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: dev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev_owner" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dev_owner:dev@localhost:5432/dev_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # CP-01: every product rule has tests, and the traceability list is current.
      - run: npm run traceability -- --check
      # DV-22: a backup of a migrated database is checksummed, copied off-host, restores and passes the integrity check.
      - name: Backup and restore check
        env:
          PGPASSWORD: dev
        run: |
          sudo apt-get install -y -qq postgresql-client-16 >/dev/null 2>&1 || true
          psql -q postgres://dev_owner:dev@localhost:5432/postgres -c "create database dev_ci"
          export DATABASE_URL=postgres://dev_owner:dev@localhost:5432/dev_ci
          MIGRATION_DATABASE_URL=$DATABASE_URL node dist/db/migrate.js
          npx tsx scripts/ci-seed.ts
          BACKUP_DIR=./backups OFFSITE_DIR=./offsite ops/backup.sh
          ADMIN_URL=postgres://dev_owner:dev@localhost:5432/postgres ops/restore-check.sh "$(ls ./offsite/*.dump | tail -1)" | tee restore.log
          # The restored copy must contain the seeded signatures, not an empty database.
          grep -Eq 'signatures: [1-9]' restore.log
  # Browser tests of the main flows (docs/05 section 5) against the built UI and the real server.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev_owner
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: dev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev_owner" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dev_owner:dev@localhost:5432/dev_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
